<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Camera Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 20px; font-weight: 400; margin-bottom: 16px; color: #aaa; }
        #videoContainer { position: relative; width: 90vw; max-width: 960px; aspect-ratio: 16/9; background: #222; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
        video { width: 100%; height: 100%; object-fit: contain; }
        #status { position: absolute; top: 12px; left: 12px; font-size: 13px; background: rgba(0,0,0,0.7); padding: 4px 14px; border-radius: 16px; z-index: 2; }
        #waiting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #666; }
        #statsBar { display: flex; gap: 28px; margin-top: 14px; font-size: 13px; color: #888; font-variant-numeric: tabular-nums; }
        #statsBar .label { color: #555; margin-right: 6px; }
        #statsBar .val { color: #ddd; }
        .dot { animation: blink 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }
        .connected { background: rgba(48, 209, 88, 0.8) !important; }
    </style>
</head>
<body>
    <h1>iPhone Virtual Webcam</h1>
    <div id="videoContainer">
        <div id="status">Connecting...</div>
        <div id="waiting">Waiting for iPhone<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
        <video id="remoteVideo" autoplay playsinline muted></video>
    </div>
    <div id="statsBar">
        <div><span class="label">Resolution</span><span class="val" id="statRes">&mdash;</span></div>
        <div><span class="label">Frame rate</span><span class="val" id="statFps">&mdash;</span></div>
        <div><span class="label">Codec</span><span class="val" id="statCodec">&mdash;</span></div>
        <div><span class="label">Bitrate</span><span class="val" id="statBitrate">&mdash;</span></div>
    </div>
    <script>
        const remoteVideo = document.getElementById('remoteVideo');
        const statusEl = document.getElementById('status');
        const waitingEl = document.getElementById('waiting');
        const statRes = document.getElementById('statRes');
        const statFps = document.getElementById('statFps');
        const statCodec = document.getElementById('statCodec');
        const statBitrate = document.getElementById('statBitrate');
        let pc, ws;
        let statsTimer = null;
        let lastBytes = 0, lastStatsTime = 0;

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/viewer`);

            ws.onopen = () => {
                statusEl.textContent = 'Waiting for iPhone to start...';
                // Tell the sender we're ready
                ws.send(JSON.stringify({ type: 'viewer-ready' }));
            };

            ws.onmessage = async (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.type === 'offer') {
                    setupPeer();
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
                } else if (msg.type === 'ice') {
                    if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected. Reconnecting...';
                statusEl.classList.remove('connected');
                setTimeout(connect, 2000);
            };
        }

        function setupPeer() {
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            pc.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                waitingEl.style.display = 'none';
                remoteVideo.play().catch(err => console.error('play() failed:', err));
            };

            pc.onicecandidate = (e) => {
                if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') {
                    statusEl.textContent = '● Live';
                    statusEl.classList.add('connected');
                    startStatsPolling();
                } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    statusEl.textContent = 'Disconnected';
                    statusEl.classList.remove('connected');
                    waitingEl.style.display = 'flex';
                    stopStatsPolling();
                }
            };
        }

        // Reads the browser's own WebRTC counters once a second. These are the real
        // received numbers, so they show what actually arrived rather than what the
        // iPhone intended to send.
        function startStatsPolling() {
            stopStatsPolling();
            lastBytes = 0;
            lastStatsTime = 0;
            statsTimer = setInterval(updateStats, 1000);
        }

        function stopStatsPolling() {
            if (statsTimer !== null) { clearInterval(statsTimer); statsTimer = null; }
            statRes.textContent = statFps.textContent = '—';
            statCodec.textContent = statBitrate.textContent = '—';
        }

        async function updateStats() {
            if (!pc) return;
            const report = await pc.getStats();
            let inbound = null, codecId = null;

            report.forEach(s => {
                if (s.type === 'inbound-rtp' && s.kind === 'video') { inbound = s; codecId = s.codecId; }
            });
            if (!inbound) return;

            const w = inbound.frameWidth, h = inbound.frameHeight;
            statRes.textContent = (w && h) ? `${w}×${h}` : '—';
            statFps.textContent = inbound.framesPerSecond != null
                ? `${Math.round(inbound.framesPerSecond)} fps` : '—';

            if (codecId) {
                const codec = report.get(codecId);
                if (codec && codec.mimeType) statCodec.textContent = codec.mimeType.replace('video/', '');
            }

            const now = performance.now();
            const bytes = inbound.bytesReceived || 0;
            if (lastStatsTime && bytes >= lastBytes) {
                const mbps = ((bytes - lastBytes) * 8) / ((now - lastStatsTime) / 1000) / 1e6;
                statBitrate.textContent = `${mbps.toFixed(1)} Mbps`;
            }
            lastBytes = bytes;
            lastStatsTime = now;
        }

        connect();
    </script>
</body>
</html>
